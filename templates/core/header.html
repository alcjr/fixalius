{% load i18n %}
{% get_current_language as LANGUAGE_CODE %}
{% get_available_languages as LANGUAGES %}
<header class="site-header site-header--minimal">
  <form class="lang" action="{% url 'set_language' %}" method="post">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.path }}">
    {% for code, name in LANGUAGES %}
      <button type="submit" name="language" value="{{ code }}" lang="{{ code }}"
              title="{{ name }}" aria-label="{{ name }}"
              aria-current="{% if code == LANGUAGE_CODE %}true{% else %}false{% endif %}">
        {% if code == 'es' %}
          <svg viewBox="0 0 24 16" aria-hidden="true" focusable="false">
            <rect width="24" height="16" fill="#c60b1e"/>
            <rect y="4" width="24" height="8" fill="#ffc400"/>
          </svg>
        {% elif code == 'en' %}
          <svg viewBox="0 0 60 30" aria-hidden="true" focusable="false">
            <clipPath id="gb-flag-clip-{{ code }}"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath>
            <rect width="60" height="30" fill="#012169"/>
            <path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/>
            <path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#gb-flag-clip-{{ code }})" stroke="#c8102e" stroke-width="4"/>
            <path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/>
            <path d="M30,0 v30 M0,15 h60" stroke="#c8102e" stroke-width="6"/>
          </svg>
        {% endif %}
      </button>
    {% endfor %}
  </form>
</header>
