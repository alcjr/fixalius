{% load i18n %}
{% with c=280 offset=0 %}
<div class="dash-donut-card" style="--kpi-color:{{ color|default:'#00b8c9' }}">
    <div class="donut-ring">
        <svg viewBox="0 0 100 100" role="img" aria-label="{{ label }}: {{ value }}">
            <circle cx="50" cy="50" r="40" fill="none" stroke="#e2e8f0" stroke-width="10"/>
            <circle cx="50" cy="50" r="40" fill="none" stroke="{{ color|default:'#00b8c9' }}"
                    stroke-width="10" stroke-linecap="round"
                    stroke-dasharray="251.2" stroke-dashoffset="0"/>
        </svg>
        <span class="ring-pct" aria-hidden="true">100%</span>
    </div>
    <div class="donut-info">
        <span class="kpi-label">{{ label }}</span>
        <span class="kpi-value">{{ value }}</span>
        {% if ref %}<span class="kpi-ref">{{ ref }}</span>{% endif %}
    </div>
</div>
{% endwith %}
